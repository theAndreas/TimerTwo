# cpplint takes a file for the test of a header only by the endings _test and _unittest, and
# reads RingBufferTest.cpp, which includes RingBuffer.h first (docs/Testing.md TS-5), as a file
# with an unrelated header before the system headers. clang-format orders the includes of a
# test instead, as .clang-format tells it which header is the test's own.
filter=-build/include_order
