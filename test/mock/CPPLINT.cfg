# The mock stands in for the Arduino core and avr-libc, and follows their names rather than the
# Google style, which is why tools/tidy.sh leaves it out as well.
# readability/nolint: cpplint 2.0.2 takes a NOLINTBEGIN of clang-tidy's checks for no block of
# its own and then reports the NOLINTEND as outside one; clang-tidy reads both.
filter=-readability/nolint
