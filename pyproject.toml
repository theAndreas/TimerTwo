# The tools this repository checks with, pinned by uv.lock: one environment for all of them, the
# same in the dev container and in CI. `uv run --frozen` runs each from it, as the Makefile does;
# --frozen so that a run never relocks, which is the business of the change to this file.
#
# This file and uv.lock come from the template, whose Dependabot keeps them current; `copier
# update` brings them, and so they name no project: `tools` is every project's. A tool of the
# project's own is added here, with `uv add --dev`, and the update keeps it.
#
# The repository's own scripts in tools/ use the standard library only and are not a package:
# nothing here is installed from this directory.

[project]
name = "tools"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    # The C++ style and its analysis, at the versions CI checks with.
    "clang-format==23.1.3",
    "clang-tidy==23.1.4",
    "cpplint==2.0.2",
    # What the tests reach of src/.
    "gcovr==8.8",
    # The shell scripts and the workflows; the binaries, shipped as wheels so that this lock pins
    # them.
    "shellcheck-py==0.11.0.1",
    "actionlint-py==1.7.12.25",
    # The Python scripts, read with the checks [tool.ruff.lint] selects.
    "ruff==0.17.3",
    # The template itself, for `uv run copier update`.
    "copier==9.19.1",
]

[tool.uv]
package = false
default-groups = ["dev"]
# A floor, not a pin: the uv that syncs this project is pinned where it is installed, the
# ARG UV_VERSION of .devcontainer/Dockerfile, which .github/actions/uv-sync reads as well.
required-version = ">=0.12.0"

# PyPI, named here so that the lockfile names it whatever machine writes it. A uv configured to
# replace the default index, a company mirror in /etc/uv/uv.toml, otherwise writes that mirror's
# addresses into uv.lock, and CI, which cannot reach them, installs nothing.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# The same rule as .clang-tidy: the checks that answer "is this wrong", none that argue with how
# the code is written. F is pyflakes, an undefined name or an import nobody uses; E9 a file
# Python cannot parse.
[tool.ruff.lint]
select = ["F", "E9"]
