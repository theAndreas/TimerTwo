set noparent
# Google puts the project in front of the path in a header guard, as in
# LIB_SRC_LIB_ERROR_H_. cpplint derives the guard from the path below
# root, so root is the parent of the checkout, and the checkout has to be
# named as the library, as Arduino names the folder of the library anyway.
root=..
extensions=h,cpp,ino
# clang-format, with the Google style, sets the indentation within a
# namespace already, and cpplint takes the lines it wraps there, a trailing
# return type or a long initializer, for indented ones.
filter=-whitespace/indent_namespace
